<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2442">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Harmony André">
  <link rel="manifest" href="/app-andre-manifest.json">
  <link rel="icon" href="/app-andre-icon.svg">
  <link rel="apple-touch-icon" href="/app-andre-icon.svg">
  <title>Harmony • Aplicativo do André</title>
  <style>
    :root{--navy:#0b2442;--blue:#123d6b;--teal:#10a39d;--green:#11845d;--bg:#edf2f7;--muted:#65758b;--danger:#b42318;--line:#dce4ee}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#10233f}button,input{font:inherit}
    .top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 15px;box-shadow:0 4px 18px #001b3a42}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px}.brand b{display:block;font-size:18px}.brand small{color:#cfe2f5}.online{margin-left:auto;font-size:12px;background:#ffffff20;padding:7px 10px;border-radius:20px}.online.ok:before{content:'●';color:#62e6aa;margin-right:5px}.online.off:before{content:'●';color:#ff8a80;margin-right:5px}
    .wrap{max-width:720px;margin:auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}.hidden{display:none!important}.card{background:#fff;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 6px 22px #102b4e12;border:1px solid #fff}.setup{text-align:center;padding:28px 20px}.setup img{width:92px}.setup input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.setup small{display:block;color:var(--muted);margin-top:12px}
    .datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}.datebar button{height:44px;border:0;border-radius:12px;background:#e7eef7;color:var(--navy);font-size:22px}.date{text-align:center;font-weight:800}.date small{display:block;color:var(--muted);font-weight:600}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f1f6fa;border-radius:14px;padding:11px 8px;text-align:center}.stat b{display:block;font-size:21px}.stat small{color:var(--muted)}
    .appointment{overflow:hidden;padding:0}.appt-head{padding:16px 17px;background:#f7f9fc;border-bottom:1px solid var(--line);display:flex;align-items:center}.time{font-size:26px;font-weight:900;color:var(--navy)}.status{margin-left:auto;padding:6px 9px;border-radius:20px;background:#e8eef7;font-size:12px;font-weight:800;text-transform:uppercase}.status.finalizado{background:#dcfce7;color:#08764b}.status.lavando{background:#dbeafe;color:#1756a9}.status.indo{background:#fef3c7;color:#995c00}.details{padding:16px 17px}.house{font-size:22px;font-weight:900}.details p{line-height:1.55;margin:9px 0}.pay{display:inline-block;padding:6px 9px;border-radius:9px;background:#eef4fa;font-weight:750}.actions{padding:0 17px 17px}.btn{width:100%;border:0;border-radius:13px;padding:14px 12px;margin-top:9px;font-weight:850;color:#fff;background:var(--navy);cursor:pointer;text-decoration:none;text-align:center;display:block}.btn:disabled,.disabled{opacity:.4;pointer-events:none}.btn.teal{background:var(--teal)}.btn.green{background:var(--green)}.btn.light{background:#e7eef7;color:var(--navy)}.btn.paybtn{background:#805ad5}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:var(--muted);padding:30px 15px}.loader{text-align:center;padding:30px;color:var(--muted)}.toolbar{display:flex;gap:8px}.toolbar .btn{margin:0;padding:11px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:20px}.toast{position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:auto;background:#0c213a;color:#fff;padding:14px 16px;border-radius:13px;box-shadow:0 10px 30px #0005;z-index:20}.toast.error{background:#8f1d16}
    @media(min-width:600px){.wrap{padding:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .btn{height:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><img src="/app-andre-icon.svg" alt="Harmony"><div><b>HARMONY CAR WASH</b><small>Aplicativo do André</small></div><span id="connection" class="online off">verificando</span></div></header>
  <main class="wrap">
    <section id="setup" class="card setup hidden"><img src="/app-andre-icon.svg" alt="Harmony"><h2>Conectar aplicativo</h2><p>Cole abaixo o link de instalação enviado pelo administrador.</p><input id="accessLink" autocomplete="off" placeholder="Cole aqui o link do aplicativo"><button class="btn" onclick="saveAccess()">Conectar</button><small>Este aparelho terá acesso somente à operação das lavagens.</small></section>
    <section id="app" class="hidden">
      <div class="card">
        <div class="datebar"><button onclick="changeDay(-1)" aria-label="Dia anterior">‹</button><div class="date" id="dateTitle"></div><button onclick="changeDay(1)" aria-label="Próximo dia">›</button></div>
        <div class="stats"><div class="stat"><b id="scheduled">0</b><small>agendados</small></div><div class="stat"><b id="finished">0/4</b><small>meta</small></div><div class="stat"><b id="received">R$ 0</b><small>recebido</small></div></div>
      </div>
      <div class="toolbar"><button id="installBtn" class="btn light hidden" onclick="installApp()">📲 Instalar</button><button class="btn light" onclick="load(true)">🔄 Atualizar</button><button class="btn light" onclick="disconnectApp()">Sair</button></div>
      <div id="list" class="loader">Carregando agenda...</div>
      <div class="footer">Atualização automática a cada 30 segundos</div>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script>
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let token='',selectedDate=todayBahia(),installPrompt=null,refreshTimer;
    function todayBahia(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bahia',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
    function dateText(v){const d=new Date(v+'T12:00:00-03:00'),today=todayBahia();let label=v===today?'Hoje':new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Bahia',weekday:'long'}).format(d);return `${label.charAt(0).toUpperCase()+label.slice(1)}<small>${new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Bahia',day:'2-digit',month:'long',year:'numeric'}).format(d)}</small>`}
    function addDays(v,n){const d=new Date(v+'T12:00:00-03:00');d.setDate(d.getDate()+n);return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bahia',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
    function payLabel(x){if(x.pagamento_status==='paid')return '✅ Pago';if(x.forma_pagamento==='pix_depois')return '🕒 Pagar após a lavagem';return '⏳ Pagamento pendente'}
    function statusLabel(s){return ({agendado:'Agendado',indo:'A caminho',lavando:'Lavando',finalizado:'Finalizado'})[s]||s}
    function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
    function notify(message,error=false){const t=$('toast');t.textContent=message;t.className='toast'+(error?' error':'');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),3300)}
    function authUrl(path){return path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(token)}
    async function api(path,options){const r=await fetch(authUrl(path),options),type=r.headers.get('content-type')||'',data=type.includes('json')?await r.json():{};if(!r.ok)throw new Error(data.error||'Não foi possível concluir esta ação.');return data}
    function getToken(value){const raw=String(value||'').trim();if(!raw)return '';try{return new URL(raw,location.origin).searchParams.get('token')||raw}catch{return raw}}
    function saveAccess(){const candidate=getToken($('accessLink').value);if(candidate.length<12)return notify('Cole o link completo enviado pelo administrador.',true);localStorage.setItem('harmony_operation_token',candidate);token=candidate;startApp()}
    function disconnectApp(){if(!confirm('Remover o acesso deste aparelho?'))return;localStorage.removeItem('harmony_operation_token');location.href='/app-andre'}
    function startApp(){$('setup').classList.add('hidden');$('app').classList.remove('hidden');load();clearInterval(refreshTimer);refreshTimer=setInterval(()=>load(false),30000)}
    function changeDay(n){selectedDate=addDays(selectedDate,n);load(true)}
    async function load(feedback=false){$('dateTitle').innerHTML=dateText(selectedDate);try{const a=await api('/api/hoje?data='+selectedDate);$('connection').className='online ok';$('connection').textContent='conectado';$('scheduled').textContent=a.length;$('finished').textContent=a.filter(x=>x.status==='finalizado').length+'/4';$('received').textContent=money(a.filter(x=>x.pagamento_status==='paid').reduce((s,x)=>s+Number(x.preco||0),0));render(a);if(feedback)notify('Agenda atualizada ✅')}catch(e){$('connection').className='online off';$('connection').textContent='sem conexão';if(/autorizado|expirada/i.test(e.message)){localStorage.removeItem('harmony_operation_token');$('app').classList.add('hidden');$('setup').classList.remove('hidden');notify('Acesso inválido. Solicite um novo link.',true)}else{$('list').innerHTML='<div class="card empty">Sem conexão com o sistema.<br>Tente atualizar novamente.</div>';if(feedback)notify(e.message,true)}}}
    function render(a){$('list').className='';$('list').innerHTML=a.map(x=>{const canGo=x.status==='agendado',canBefore=['indo','lavando'].includes(x.status),canStart=x.status==='indo'&&x.foto_antes,canAfter=x.status==='lavando',canFinish=x.status==='lavando'&&x.foto_antes&&x.foto_depois,phone=String(x.whatsapp||'').replace(/\D/g,'');return `<article class="card appointment"><div class="appt-head"><div class="time">${esc(x.horario)}</div><span class="status ${esc(x.status)}">${esc(statusLabel(x.status))}</span></div><div class="details"><div class="house">🏠 Casa ${esc(x.casa)}</div><p>👤 <b>${esc(x.nome)}</b><br>🚘 ${esc(x.modelo)} — ${esc(x.cor)}<br>🧽 ${esc(x.servico)} — ${money(x.preco)}<br><span class="pay">${payLabel(x)}</span></p><div class="twocol"><a class="btn light" href="https://wa.me/${phone}" target="_blank">💬 Cliente</a><button class="btn light" onclick="editName(${x.cliente_id},'${encodeURIComponent(x.nome||'')}')">✏️ Nome</button></div></div><div class="actions"><button class="btn teal" ${canGo?'':'disabled'} onclick="setStatus(${x.id},'indo')">🏠 Estou indo</button><label class="btn light ${canBefore?'':'disabled'}">📸 Foto antes<input hidden type="file" accept="image/jpeg,image/png,image/webp" capture="environment" ${canBefore?'':'disabled'} onchange="photo(${x.id},'antes',this)"></label><button class="btn" ${canStart?'':'disabled'} onclick="setStatus(${x.id},'iniciar')">🚿 Iniciar lavagem</button><label class="btn light ${canAfter?'':'disabled'}">📸 Foto depois<input hidden type="file" accept="image/jpeg,image/png,image/webp" capture="environment" ${canAfter?'':'disabled'} onchange="photo(${x.id},'depois',this)"></label><button class="btn green" ${canFinish?'':'disabled'} onclick="finishWash(${x.id})">✨ Finalizar + montagem</button>${x.pagamento_status!=='paid'?`<button class="btn paybtn" onclick="confirmPayment(${x.id})">💳 Confirmar pagamento</button>`:''}</div></article>`}).join('')||'<div class="card empty">Nenhuma lavagem agendada para este dia.</div>'}
    async function setStatus(id,status){try{await api(`/api/agendamento/${id}/status`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});notify(status==='indo'?'Cliente avisado: estou indo ✅':'Lavagem iniciada e cliente avisado ✅');load()}catch(e){notify(e.message,true)}}
    async function photo(id,type,input){if(!input.files[0])return;const f=new FormData();f.append('foto',input.files[0]);try{notify('Enviando foto...');await api(`/api/agendamento/${id}/foto/${type}`,{method:'POST',body:f});notify('Foto salva ✅');load()}catch(e){notify(e.message,true)}}
    async function finishWash(id){if(!confirm('Finalizar a lavagem e enviar a montagem ao cliente?'))return;try{notify('Criando e enviando montagem...');await api(`/api/agendamento/${id}/finalizar`,{method:'POST'});notify('Lavagem finalizada ✅');load()}catch(e){notify(e.message,true)}}
    async function confirmPayment(id){if(!confirm('Confirma que recebeu o pagamento desta lavagem?'))return;try{await api(`/api/agendamento/${id}/pagamento-recebido`,{method:'POST'});notify('Pagamento confirmado ✅');load()}catch(e){notify(e.message,true)}}
    async function editName(id,current){const nome=prompt('Nome que a assistente deve usar:',decodeURIComponent(current));if(nome===null)return;try{await api(`/api/clientes/${id}/nome`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({nome})});notify('Nome atualizado ✅');load()}catch(e){notify(e.message,true)}}
    async function installApp(){if(!installPrompt)return notify('No Chrome, abra o menu ⋮ e escolha “Adicionar à tela inicial”.');installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').classList.add('hidden')}
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installBtn').classList.remove('hidden')});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/app-andre-sw.js').catch(()=>{});
    const queryToken=new URLSearchParams(location.search).get('token');if(queryToken){localStorage.setItem('harmony_operation_token',queryToken);history.replaceState({},'', '/app-andre')}token=queryToken||localStorage.getItem('harmony_operation_token')||'';if(token)startApp();else $('setup').classList.remove('hidden');
  </script>
</body>
</html>
