name: Gerar aplicativos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-apps/**"
      - ".github/workflows/build-android-apks.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar os dois APKs
        run: gradle -p android-apps :admin:assembleDebug :andre:assembleDebug

      - name: Organizar arquivos
        run: |
          mkdir -p apks
          cp android-apps/admin/build/outputs/apk/debug/admin-debug.apk apks/Harmony-Administrador.apk
          cp android-apps/andre/build/outputs/apk/debug/andre-debug.apk apks/Harmony-Andre.apk

      - name: Disponibilizar APKs
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Android-APKs
          path: apks/*.apk
          retention-days: 30
